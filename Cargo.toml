[package]
name = "s3pe-admin"
version = "0.3.0"
authors = ["André Leite <leite@castlab.org>"]
edition = "2021"
rust-version = "1.85"
description = "Small, secure web console for a Garage object store: buckets, keys and permissions, with passkey login and an audit log"
license = "MIT"
repository = "https://github.com/StrategicProjects/s3pe-admin"
publish = false

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["set-header", "trace"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
anyhow = "1"
thiserror = "2"
# webauthn-rs needs OpenSSL; vendored so the musl release binary is static.
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

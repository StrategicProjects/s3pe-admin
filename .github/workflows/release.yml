name: release
# On a tag vX.Y.Z: a static Linux x86_64 binary attached to the GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: |
          cp target/x86_64-unknown-linux-musl/release/s3pe-admin s3pe-admin-linux-x86_64
          sha256sum s3pe-admin-linux-x86_64 > s3pe-admin-linux-x86_64.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            s3pe-admin-linux-x86_64
            s3pe-admin-linux-x86_64.sha256
